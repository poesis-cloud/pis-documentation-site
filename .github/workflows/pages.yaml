name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Pick up GSM source updates without committing copies into this repo.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require GSM_CONTENT_READ_TOKEN
        env:
          TOKEN: ${{ secrets.GSM_CONTENT_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Set repo/org secret GSM_CONTENT_READ_TOKEN with contents:read on poesis-cloud/gsm-specifications and poesis-cloud/gsm-research-lab." >&2
            exit 1
          fi

      # Private GSM sources. Requires repo/org secret GSM_CONTENT_READ_TOKEN
      # with contents:read on poesis-cloud/gsm-specifications and
      # poesis-cloud/gsm-research-lab. Do not commit generated copies.
      - name: Checkout GSM specifications
        uses: actions/checkout@v4
        with:
          repository: poesis-cloud/gsm-specifications
          path: _sources/gsm-specifications
          token: ${{ secrets.GSM_CONTENT_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout GSM research lab
        uses: actions/checkout@v4
        with:
          repository: poesis-cloud/gsm-research-lab
          path: _sources/gsm-research-lab
          token: ${{ secrets.GSM_CONTENT_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Sync GSM content
        env:
          GSM_SPECIFICATIONS_ROOT: ${{ github.workspace }}/_sources/gsm-specifications
          GSM_RESEARCH_LAB_ROOT: ${{ github.workspace }}/_sources/gsm-research-lab
        run: ./scripts/sync-gsm-content.sh

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
